<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Blood Report Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white shadow-lg rounded-lg p-8 max-w-lg w-full">
        <h1 class="text-2xl font-bold text-center mb-6">Mini Blood Report Analyzer 🩺</h1>

        <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            <strong class="font-bold">Error:</strong>
            <span class="block sm:inline" id="error-text"></span>
        </div>

        <div class="space-y-4">
            <div>
                <label for="apiKey" class="block text-sm font-medium text-gray-700">Gemini API Key</label>
                <input type="password" id="apiKey" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Paste your API key here">
            </div>

            <div>
                <label for="pdfFile" class="block text-sm font-medium text-gray-700">Blood Report PDF</label>
                <input type="file" id="pdfFile" accept="application/pdf" class="mt-1 block w-full text-sm text-gray-500
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-md file:border-0
                    file:text-sm file:font-semibold
                    file:bg-indigo-50 file:text-indigo-600
                    hover:file:bg-indigo-100
                "/>
            </div>

            <button id="analyzeBtn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                <span id="button-text">Analyze Report</span>
                <svg id="loading-spinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </div>

        <div id="results-container" class="mt-6 hidden">
            <h2 class="text-xl font-semibold mb-2">Analysis Results</h2>
            <div id="results" class="prose max-w-none p-4 bg-gray-50 rounded-md border"></div>
        </div>
    </div>

    <script>
        const apiKeyInput = document.getElementById('apiKey');
        const pdfFileInput = document.getElementById('pdfFile');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const buttonText = document.getElementById('button-text');
        const loadingSpinner = document.getElementById('loading-spinner');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const resultsContainer = document.getElementById('results-container');
        const resultsDiv = document.getElementById('results');

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';

        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        function clearError() {
            errorMessage.classList.add('hidden');
        }

        function setLoading(isLoading) {
            if (isLoading) {
                buttonText.classList.add('hidden');
                loadingSpinner.classList.remove('hidden');
                analyzeBtn.disabled = true;
            } else {
                buttonText.classList.remove('hidden');
                loadingSpinner.classList.add('hidden');
                analyzeBtn.disabled = false;
            }
        }

        analyzeBtn.addEventListener('click', async () => {
            clearError();
            resultsContainer.classList.add('hidden');
            const apiKey = apiKeyInput.value.trim();
            const pdfFile = pdfFileInput.files[0];

            if (!apiKey) {
                showError('Please enter your Gemini API key.');
                return;
            }

            if (!pdfFile) {
                showError('Please select a PDF file.');
                return;
            }

            if (pdfFile.type !== 'application/pdf') {
                showError('Please select a valid PDF file.');
                return;
            }

            setLoading(true);
            try {
                const pdfText = await extractTextFromPdf(pdfFile);
                const analysis = await callGeminiApi(apiKey, pdfText);
                resultsDiv.innerHTML = analysis.replace(/\n/g, '<br>');
                resultsContainer.classList.remove('hidden');
            } catch (error) {
                showError(`${error.message}`);
            } finally {
                setLoading(false);
            }
        });

        async function callGeminiApi(apiKey, text) {
            // --- FIX IS HERE ---
            // Changed "gemini-1.5-flash" to the correct model name "gemini-2.5-flash"
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            
            const prompt = `You are an expert medical analyst AI. Analyze the provided blood report text. Identify key biomarkers, compare their values to the normal ranges given in the text, and determine if they are high, low, or normal. Summarize the findings in simple, easy-to-understand language for a non-medical person. Organize the results clearly and start with a bold disclaimer: DISCLAIMER: This is an AI analysis and not medical advice. Consult a doctor. Here is the report text:\n\n${text}`;

            const payload = {
                contents: [{
                    parts: [{ text: prompt }]
                }]
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error.message || 'API call failed');
            }

            const data = await response.json();
            if (!data.candidates || !data.candidates[0].content.parts[0].text) {
                throw new Error('Invalid response from API.');
            }
            return data.candidates[0].content.parts[0].text;
        }

        async function extractTextFromPdf(file) {
            const reader = new FileReader();
            return new Promise((resolve, reject) => {
                reader.onload = async (event) => {
                    try {
                        const pdf = await pdfjsLib.getDocument({ data: event.target.result }).promise;
                        let allText = '';
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            const pageText = textContent.items.map(item => item.str).join(' ');
                            allText += pageText + '\n\n';
                        }
                        resolve(allText);
                    } catch (error) {
                        reject(error);
                    }
                };
                reader.onerror = (error) => reject(error);
                reader.readAsArrayBuffer(file);
            });
        }
    </script>
</body>
</html>
